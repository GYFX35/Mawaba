name: Feature Request
description: Suggest an idea or feature for Mawaba
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe your proposed feature or improvement in detail.

  - type: input
    id: summary
    attributes:
      label: Feature Title
      description: A concise title for your feature proposal.
      placeholder: e.g. Add dark mode toggle in main navigation
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Target Area
      description: Where should this feature be implemented?
      options:
        - Frontend UI / UX (apps/frontend)
        - Backend REST API (apps/backend)
        - AI Service & Models (apps/ai-service)
        - Integrations & External Services
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g. I'm always frustrated when...)
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
