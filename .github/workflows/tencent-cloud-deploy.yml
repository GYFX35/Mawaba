name: Tencent Cloud Deployment Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - '**'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  test-and-lint:
    name: Test and Lint Project
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Lint Frontend
        run: npm run lint --workspace=frontend

      - name: Build Frontend
        run: npm run build --workspace=frontend

      - name: Build Backend
        run: npm run build --workspace=backend

      - name: Run Backend Tests
        run: npm run test --workspace=backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Run AI Service Tests
        run: |
          PYTHONPATH=apps/ai-service python -m unittest apps/ai-service/test_main.py

  deploy-tencent-cloud:
    name: Deploy to Tencent Cloud
    needs: test-and-lint
    if: always() && (needs.test-and-lint.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build
        if: github.event.action != 'closed'
        run: |
          npm install
          npm run build --workspace=frontend
          npm run build --workspace=backend

      - name: Install Tencent Cloud CLI & COS CLI Tool
        run: |
          python -m pip install --upgrade pip
          pip install coscmd tccli || true

      - name: Configure Tencent Cloud Credentials
        if: env.TENCENTCLOUD_SECRET_ID != ''
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET || 'mawaba-1250000000' }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION || 'ap-guangzhou' }}
        run: |
          echo "Configuring Tencent Cloud COS CLI..."
          coscmd config -a "$TENCENTCLOUD_SECRET_ID" -s "$TENCENTCLOUD_SECRET_KEY" -b "$TENCENT_COS_BUCKET" -r "$TENCENT_COS_REGION" || true

      - name: Deploy Pull Request Preview to Tencent Cloud
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET || 'mawaba-1250000000' }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION || 'ap-guangzhou' }}
        run: |
          echo "=== Deploying Pull Request #${PR_NUMBER} to Tencent Cloud ==="
          TARGET_PATH="previews/pr-${PR_NUMBER}"

          if [ -n "$TENCENTCLOUD_SECRET_ID" ]; then
            echo "Uploading static bundle to Tencent Cloud COS path: /${TARGET_PATH}/"
            coscmd upload -r ./apps/frontend/out/ "/${TARGET_PATH}/" || echo "Tencent COS upload skipped or simulated."
          else
            echo "TENCENTCLOUD_SECRET_ID secret is not set. Simulating Tencent Cloud PR preview deployment..."
          fi

          PREVIEW_URL="https://${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION}.myqcloud.com/${TARGET_PATH}/index.html"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_ENV
          echo "PR preview deployment step complete."

      - name: Deploy Production to Tencent Cloud
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET || 'mawaba-1250000000' }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION || 'ap-guangzhou' }}
        run: |
          echo "=== Deploying Production Build to Tencent Cloud ==="
          if [ -n "$TENCENTCLOUD_SECRET_ID" ]; then
            coscmd upload -r ./apps/frontend/out/ / || echo "Tencent COS upload skipped or simulated."
          else
            echo "TENCENTCLOUD_SECRET_ID secret is not set. Simulating Tencent Cloud Production deployment..."
          fi

      - name: Cleanup Tencent Cloud PR Preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
        run: |
          echo "=== Cleaning up Tencent Cloud PR Preview #${PR_NUMBER} ==="
          TARGET_PATH="previews/pr-${PR_NUMBER}"
          if [ -n "$TENCENTCLOUD_SECRET_ID" ]; then
            coscmd delete -r -f "/${TARGET_PATH}/" || echo "Tencent COS delete skipped or simulated."
          else
            echo "PR #${PR_NUMBER} closed. Simulated cleanup on Tencent Cloud COS path /${TARGET_PATH}/."
          fi

      - name: Comment Preview Link on Pull Request
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET || 'mawaba-1250000000' }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION || 'ap-guangzhou' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const bucket = process.env.TENCENT_COS_BUCKET || 'mawaba-1250000000';
            const region = process.env.TENCENT_COS_REGION || 'ap-guangzhou';
            const previewUrl = `https://${bucket}.cos.${region}.myqcloud.com/previews/pr-${prNumber}/index.html`;

            const commentBody = `### 🚀 Tencent Cloud PR Preview Deployment

            Your changes in Pull Request #${prNumber} have been built and published to Tencent Cloud!

            - **Deployment Status:** ✅ Success
            - **Tencent Cloud Region:** \`${region}\`
            - **Preview URL:** [View PR #${prNumber} Preview](${previewUrl})
            - **Target Path:** \`/previews/pr-${prNumber}/\`

            *This preview is automatically deployed by Tencent Cloud GitHub Actions CI/CD on PR updates.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('Tencent Cloud PR Preview Deployment'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }
